name: Kraken DCA Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - --reconcile
          - --weekly
          - --force
          - --resume-kas
      trade_date:
        description: "Resume only: Chicago trade date (YYYY-MM-DD)"
        required: false
        type: string
      target_time:
        description: "Resume only: configured Chicago target (HH:MM)"
        required: false
        type: string
      execution_row_id:
        description: "Resume only: preflight-skipped execution row ID"
        required: false
        type: string

concurrency:
  group: dca-bot
  cancel-in-progress: false

jobs:
  dca-run:
    # Review branches must not run this credentialed workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run DCA Bot
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DCA_RUN_MODE: ${{ inputs.mode }}
          DCA_RESUME_DATE: ${{ inputs.trade_date }}
          DCA_RESUME_TIME: ${{ inputs.target_time }}
          DCA_RESUME_ROW: ${{ inputs.execution_row_id }}
        run: |
          if [[ "$DCA_RUN_MODE" != --resume-kas && -n "${DCA_RESUME_DATE}${DCA_RESUME_TIME}${DCA_RESUME_ROW}" ]]; then
            echo "Resume fields require --resume-kas mode." >&2
            exit 2
          fi
          case "$DCA_RUN_MODE" in
            '') python src/kraken_run.py ;;
            --reconcile|--weekly|--force) python src/kraken_run.py "$DCA_RUN_MODE" ;;
            --resume-kas)
              if [[ ! "$DCA_RESUME_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ||
                    ! "$DCA_RESUME_TIME" =~ ^[0-9]{2}:[0-9]{2}$ ||
                    ! "$DCA_RESUME_ROW" =~ ^[1-9][0-9]*$ ]]; then
                echo "Resume requires a Chicago date, target time and execution row ID." >&2
                exit 2
              fi
              python src/kraken_run.py --resume-kas "$DCA_RESUME_DATE" "$DCA_RESUME_TIME" "$DCA_RESUME_ROW"
              ;;
            *) echo "Invalid DCA mode." >&2; exit 2 ;;
          esac
